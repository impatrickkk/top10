<body>
<canvas id="gl"></canvas>
<main id="lib" hidden><div class="wrap">
  <header><h1>Top 10</h1><p>Rank your favourite songs, then count them down.</p></header>
  <nav id="tabs"></nav>
  <input id="q" type="text" placeholder="Search for a song" aria-label="Search for a song">
  <ul id="results"></ul>
  <ol id="songs"></ol>
  <div class="acts"><button class="cta" id="present">Start the countdown</button><button class="link" id="ren">Rename</button><button class="link" id="del">Delete</button><button class="link" id="exp">Export</button><button class="link" id="imp">Import</button></div>

    <h2 id="bt"></h2>

        </div>

      </div>
      <div class="Timeline"><span class="Position" id="tcur">0:00</span><div class="SliderBar" id="bar"><div class="Hitbox"></div><div class="Handle"></div></div><span class="Length" id="ttot">0:00</span></div>
      <div class="TrackDetails"><div class="Title"><span id="title"></span></div><div class="Release"><span id="date"></span><span class="Sep" id="sep"></span><span id="artists"></span></div></div>

  </div>
</div>

  <h2>Top 10</h2>
  <p>Count down your favourite songs, from the chorus to the end, with the lyrics of each.</p>

<script>
"use strict";
const CLIP=15000,SCOPE="streaming user-read-email user-read-private user-modify-playback-state user-read-playback-state";
const RURI=location.origin+location.pathname.replace(/index\.html$/,"");
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=s=>Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
const parseT=v=>{const p=String(v).trim().split(":").map(Number);return p.some(isNaN)?0:p.length>1?p[0]*60+p[1]:p[0]};
const store={get:k=>{try{return localStorage.getItem(k)}catch{return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch{}}};
let tt;const toast=m=>{const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),3500)};

let data;try{data=JSON.parse(store.get("top10.v1"))}catch{}
if(!data||!Array.isArray(data.lists)||!data.lists.length)data={cur:0,lists:[{name:"My top 10",songs:[]}]};
data.cur=Math.min(data.cur||0,data.lists.length-1);
const save=()=>store.set("top10.v1",JSON.stringify(data));
const list=()=>data.lists[data.cur];
let cid=store.get("top10.cid")||store.get("cid")||"";

const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
class Spring {
  constructor(i, d, f) { this.p = i; this.f = i; this.v = 0; this.d = d; this.fr = f; }
  Update(dt) {
    const w = this.fr * Math.PI * 2, fin = this.f, v = this.v, o = this.p - fin, d = this.d, dec = Math.exp(-d * w * dt); let np, nv;
    if (d == 1) { np = ((o * (1 + w * dt) + v * dt) * dec) + fin; nv = (v * (1 - w * dt) - o * (w * w * dt)) * dec; }
    else if (d < 1) { const c = Math.sqrt(1 - d * d), i = Math.cos(w * c * dt), j = Math.sin(w * c * dt), z = j / c, y = j / (w * c); np = ((o * (i + d * z) + v * y) * dec) + fin; nv = (v * (i - z * d) - o * (z * w)) * dec; }
    else { const c = Math.sqrt(d * d - 1), r1 = -w * (d - c), r2 = -w * (d + c), co2 = (v - o * r1) / (2 * w * c), co1 = o - co2, e1 = co1 * Math.exp(r1 * dt), e2 = co2 * Math.exp(r2 * dt); np = e1 + e2 + fin; nv = e1 * r1 + e2 * r2; }
    this.p = np; this.v = nv; return np;
  }
  Set(x) { this.p = x; this.f = x; this.v = 0; }

function parseLRC(t){
  const out=[];

    const txt=row.replace(/\[[^\]]*\]/g,"").trim();
    tags.forEach(m=>out.push({t:(+m[1]*60+ +m[2])*1000,s:txt||"♪"}));
  }
  return out.sort((a,b)=>a.t-b.t);
}
async function loadLRC(s){

  const L="https://lrclib.net/api/",a=s.artist.split(",")[0].trim(),sec=s.dur?Math.round(s.dur/1000):0;
  let d=s.album&&sec?await j(L+"get?"+new URLSearchParams({track_name:s.title,artist_name:a,album_name:s.album,duration:sec})):null;
  if(!d||!d.syncedLyrics){
    const clean=s.title.replace(/\s*[\(\[].*$/,"").replace(/\s+-\s+.*$/,"").trim();
    const res=(await j(L+"search?"+new URLSearchParams({track_name:clean,artist_name:a})))||[];
    const ok=res.filter(x=>!sec||Math.abs(x.duration-sec)<=6);
    d=ok.find(x=>x.syncedLyrics)||(d&&d.plainLyrics?d:null)||ok.concat(res).find(x=>x.plainLyrics)||null;
  }
  return{lrc:d&&d.syncedLyrics||"",plain:d&&d.plainLyrics||""};

/* Chorus = the block of lines that repeats the most; its first occurrence is where we start. */
function chorusAt(lines){
  const ls=lines.filter(l=>l.s&&l.s!=="♪"),n=ls.length;if(n<6)return null;

    const r=len[i][j];if(r<2||(i>0&&len[i-1][j-1]>0))continue;
    const m=Math.min(r,j-i);if(m<2)continue;

const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");

async function authUrl(){
  const v=b64(crypto.getRandomValues(new Uint8Array(48)));

  const ch=b64(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(v)));
  return"https://accounts.spotify.com/authorize?"+new URLSearchParams({client_id:cid,response_type:"code",redirect_uri:RURI,scope:SCOPE,code_challenge_method:"S256",code_challenge:ch});
}
async function login(){
  cid=$("#cid").value.trim();

  if(!/^https:\/\//.test(RURI)&&!/^http:\/\/(127\.0\.0\.1|\[::1\])/.test(RURI))return toast("Open this page from its https address, for example your GitHub Pages link. Spotify can’t send you back to a local file.");

  const r=await fetch("https://api.spotify.com/v1"+path,{method,headers:{Authorization:"Bearer "+await token(),...(body?{"Content-Type":"application/json"}:{})},body:body?JSON.stringify(body):undefined});

    player.connect();
  };
  const s=document.createElement("script");s.id="sdk";s.src="https://sdk.scdn.co/spotify-player.js";document.head.append(s);
}
async function playClip(s,limit){
  clearTimeout(clipTimer);
  if(!deviceId)return toast("The player is still starting. Try again in a moment.");
  const from=startOf(s);S.want=s.uri;S.ended=false;S.dur=s.dur||0;
  try{
    await api("PUT","/me/player/play?device_id="+deviceId,{uris:[s.uri],position_ms:from});
    S.pos=from;S.t0=performance.now();S.playing=true;setPP();
    if(limit)clipTimer=setTimeout(()=>{player.pause();S.playing=false;setPP()},limit);
  }catch(e){S.playing=false;setPP();toast(e.message)}
}
function stopClip(){clearTimeout(clipTimer);if(player)player.pause();S.playing=false;setPP()}

/* ---------- Library ---------- */
let lastTab=-1;
function render(){const fresh=lastTab!==data.cur;lastTab=data.cur;
  const authed=!!tok();$("#start").hidden=authed;$("#lib").hidden=!authed||live;document.body.classList.toggle("inlib",!live);
  $("#tabs").innerHTML=data.lists.map((l,i)=>`<button class="pill${i===data.cur?" on":""}" data-i="${i}">${esc(l.name)}</button>`).join("")+`<button class="pill" id="add" aria-label="New list">+</button>`;
  $("#songs").innerHTML=list().songs.map((s,i)=>`<li class="row${fresh?" in":""}" data-i="${i}" style="--i:${i}"><span class="rk">${i+1}</span><img src="${esc(s.img)}" alt=""><div class="tx"><b>${esc(s.title)}</b><span>${esc(s.artist)}</span></div><input class="st" value="${s.start>0?fmt(s.start):""}" placeholder="${s.auto>=0?fmt(Math.floor(s.auto/1000)):"auto"}" aria-label="Chorus starts at (m:ss). Leave empty for automatic."><button class="ic play" aria-label="Preview 15 seconds">▶</button><button class="ic up" aria-label="Move up">↑</button><button class="ic dn" aria-label="Move down">↓</button><button class="ic rm" aria-label="Remove">✕</button></li>`).join("")||`<li class="empty">Search for a song and add it to this list.</li>`;
  bg((list().songs[0]||{}).img||idle());
}
$("#tabs").onclick=e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.id==="add"){const n=prompt("Name your list, for example Top 10 rap");if(!n)return;data.lists.push({name:n,songs:[]});data.cur=data.lists.length-1}
  else data.cur=+b.dataset.i;
  save();render();
};
$("#songs").onclick=e=>{
  const li=e.target.closest("li[data-i]");if(!li)return;
  const i=+li.dataset.i,L=list().songs,c=e.target.classList;
  if(c.contains("rm"))L.splice(i,1);
  else if(c.contains("up")&&i>0)[L[i-1],L[i]]=[L[i],L[i-1]];
  else if(c.contains("dn")&&i<L.length-1)[L[i+1],L[i]]=[L[i],L[i+1]];
  else if(c.contains("play")){if(player)player.activateElement();lyricsFor(L[i]).then(()=>playClip(L[i],15000));return}
  else return;
  save();render();
};
$("#songs").onchange=e=>{
  if(!e.target.classList.contains("st"))return;
  list().songs[+e.target.closest("li").dataset.i].start=parseT(e.target.value);save();render();
};
let found=[],qt;
async function search(){
  const q=$("#q").value.trim();if(!q){$("#results").innerHTML="";return}
  try{
    found=(await api("GET","/search?type=track&limit=10&q="+encodeURIComponent(q))).tracks.items;
    $("#results").innerHTML=found.map((t,i)=>`<li class="row" data-i="${i}"><img src="${esc((t.album.images[2]||t.album.images[0]||{}).url)}" alt=""><div class="tx"><b>${esc(t.name)}</b><span>${esc(t.artists.map(a=>a.name).join(", "))}</span></div><button class="chip">Add</button></li>`).join("");
  }catch(e){toast(e.message)}
}
$("#q").oninput=()=>{clearTimeout(qt);qt=setTimeout(search,350)};
$("#results").onclick=e=>{
  const li=e.target.closest("li");if(!li||!e.target.closest("button"))return;
  if(list().songs.length>=10)return toast("A top 10 holds ten songs");
  const t=found[li.dataset.i];
  list().songs.push({uri:t.uri,title:t.name,artist:t.artists.map(a=>a.name).join(", "),album:t.album.name,year:(t.album.release_date||"").slice(0,4),dur:t.duration_ms,img:(t.album.images[0]||{}).url||"",start:0});
  save();render();toast("Added to "+list().name);lyricsFor(list().songs[list().songs.length-1]);
};
$("#ren").onclick=()=>{const n=prompt("New name",list().name);if(n){list().name=n;save();render()}};
$("#del").onclick=()=>{if(data.lists.length<2)return toast("Keep at least one list");if(confirm("Delete “"+list().name+"”?")){data.lists.splice(data.cur,1);data.cur=0;save();render()}};
$("#exp").onclick=()=>navigator.clipboard.writeText(JSON.stringify(data)).then(()=>toast("Lists copied to the clipboard"));
$("#imp").onclick=()=>{const t=prompt("Paste your exported lists");if(!t)return;try{const d=JSON.parse(t);if(!Array.isArray(d.lists)||!d.lists.length)throw 0;data=d;data.cur=0;save();render()}catch{toast("Those lists couldn’t be read")}};
$("#login").onclick=login;

/* ---------- Countdown ---------- */
let live=false,revealed=0,cur=null,lastBg="",idleUrl="";
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const idle=()=>idleUrl||(idleUrl=(()=>{const c=document.createElement("canvas");c.width=c.height=300;const x=c.getContext("2d"),g=x.createLinearGradient(0,0,300,300);g.addColorStop(0,"#1c2a6b");g.addColorStop(.55,"#b4457a");g.addColorStop(1,"#f2a65a");x.fillStyle=g;x.fillRect(0,0,300,300);return c.toDataURL("image/jpeg",.9)})());
const bg=url=>{if(url&&url!==lastBg){lastBg=url;blurCover(url)}};
const msg=t=>{const m=$("#msg");m.textContent=t||"";m.style.display=t?"flex":"none"};
const startOf=s=>s.start>0?s.start*1000:s.auto>=0?s.auto:Math.round((s.dur||180000)*.3);
const setPP=()=>{$("#pp").innerHTML=S.playing?ICON.pause:ICON.play};

function present(){
  const L=list().songs;if(!L.length)return toast("Add at least one song first");
  if(!player||!deviceId)return toast("The player is still starting. Try again in a moment.");
  player.activateElement();L.forEach(lyricsFor);live=true;
  $("#lib").hidden=true;$("#stage").hidden=false;document.body.classList.remove("inlib");buildBoard();
}
function buildBoard(){
  const L=list().songs;revealed=0;cur=null;
  $("#bt").textContent=list().name;
  $("#board").innerHTML=L.map((s,i)=>`<div class="card" data-i="${i}" style="--i:${i}" role="button" tabindex="0"><div class="inner"><div class="face front"><span class="rn">${i+1}</span><span class="qm">?</span></div><div class="face back"><img src="${esc(s.img)}" alt=""><span class="rn">${i+1}</span><div class="cap"><b>${esc(s.title)}</b><span>${esc(s.artist)}</span></div></div></div></div>`).join("");
  updateCards();bg(idle());
}
function updateCards(){
  const L=list().songs,N=L.length;
  [...$("#board").children].forEach((c,i)=>{
    const rev=i>=N-revealed,next=i===N-revealed-1;
    c.classList.toggle("flip",rev);c.classList.toggle("next",next);c.classList.toggle("locked",!rev&&!next);
    c.setAttribute("aria-label",rev?L[i].title:"Hidden song number "+(i+1));
  });
  const nx=$("#board").children[N-revealed-1];if(nx&&nx.scrollIntoView&&matchMedia("(max-width:860px)").matches)nx.scrollIntoView({behavior:"smooth",block:"center"});
  $("#bs").textContent=revealed>=N?"That’s your top "+N+".":revealed?"Number "+(N-revealed)+" is next":"Click the glowing card to reveal number "+N;
}
$("#board").onclick=e=>{
  const c=e.target.closest(".card");if(!c||cur)return;
  const i=+c.dataset.i,N=list().songs.length;
  if(i===N-revealed-1)reveal(i);
  else if(i>=N-revealed)openSong(i,0);
  else{c.classList.remove("shake");void c.offsetWidth;c.classList.add("shake");toast("Reveal number "+(N-revealed)+" first")}
};
function reveal(i){revealed++;updateCards();openSong(i,700)}
function fillModal(s,rank){
  $("#rank").textContent=rank;$("#title").textContent=s.title;
  $("#date").textContent=s.year||"";$("#sep").style.display=s.year?"":"none";
  const ar=$("#artists");ar.innerHTML="";
  s.artist.split(", ").forEach((n,k)=>{if(k)ar.append(", ");const b=document.createElement("b");b.textContent=n;ar.append(b)});
  const im=$("#art");im.classList.remove("on");im.src=s.img;void im.offsetWidth;im.classList.add("on");
  $("#ttot").textContent=fmt(Math.floor((s.dur||0)/1000));$("#tcur").textContent="0:00";
  $("#bar").style.setProperty("--p",0);S.lines=[];$("#list").innerHTML="";msg("");
}
async function openSong(i,delay){
  const s=list().songs[i];cur=s;fillModal(s,i+1);bg(s.img);
  const r=await Promise.race([lyricsFor(s),sleep(3500)]);if(cur!==s)return;
  playClip(s);
  setTimeout(()=>{if(cur!==s)return;$("#stage").classList.add("mo");$("#modal").classList.add("on");S.idx=-2},delay);
  if(r)showLyrics(r);else lyricsFor(s).then(x=>{if(cur===s)showLyrics(x)});
}
function showLyrics(r){
  const syn=parseLRC(r.lrc);
  if(syn.length)renderLines(syn,false);
  else if(r.plain)renderLines(r.plain.split("\n").map(s=>({t:0,s:s||" "})),true);
  else msg("No lyrics found");
}
function renderLines(lines,plain){
  const box=$("#list");box.innerHTML="";box.style.transform="";S.idx=-2;S.lines=plain?[]:lines;
  document.body.classList.toggle("plain",!!plain);$("#vp").scrollTop=0;msg("");
  lines.forEach(l=>{const el=document.createElement("div");el.className="g";el.innerHTML='<div class="v Idle"><span class="ln"></span></div>';el.querySelector(".ln").textContent=l.s;if(!plain)el.onclick=()=>seek(l.t);box.appendChild(el)});
}
function paint(){
  if(!S.lines.length)return;
  const L=$("#list").children;
  for(let k=0;k<L.length;k++){
    L[k].firstChild.className="v "+(k<S.idx?"Sung":k===S.idx?"Active":"Idle");
    L[k].firstChild.firstChild.style.setProperty("--b",Math.min(Math.abs(k-Math.max(S.idx,0)),4)*1.25+"px");
  }
  const el=L[Math.max(S.idx,0)];if(!el)return;
  $("#list").style.transform=`translateY(${$("#vp").clientHeight/2-(el.offsetTop+el.offsetHeight/2)}px)`;
}
function closeModal(){
  if(!cur)return;
  stopClip();cur=null;S.lines=[];
  $("#modal").classList.remove("on");$("#stage").classList.remove("mo");updateCards();
}
function leave(){
  live=false;stopClip();cur=null;$("#modal").classList.remove("on");$("#stage").classList.remove("mo");
  $("#stage").hidden=true;$("#lib").hidden=false;render();
}
function switchList(d){const n=data.lists.length;data.cur=(data.cur+d+n)%n;save();stopClip();buildBoard()}
function seek(ms){ms=clamp(ms,0,S.dur||ms);S.pos=ms;S.t0=performance.now();if(player)player.seek(ms)}
function togglePlay(){
  if(!cur||!player)return;
  if(S.ended){playClip(cur);return}
  S.pos=pos();S.t0=performance.now();S.playing=!S.playing;setPP();player.togglePlay();
}
function slider(el,on,done){
  const hb=el.querySelector(".Hitbox"),r=e=>{const b=el.getBoundingClientRect();return clamp((e.clientX-b.left)/b.width,0,1)};
  let d=false;
  hb.onpointerdown=e=>{d=true;hb.setPointerCapture(e.pointerId);on(r(e))};
  hb.onpointermove=e=>d&&on(r(e));
  hb.onpointerup=e=>{if(d){d=false;done(r(e))}};
}
slider($("#bar"),r=>{S.drag=true;$("#bar").style.setProperty("--p",r);$("#tcur").textContent=fmt(Math.floor(r*S.dur/1000))},r=>{S.drag=false;seek(r*S.dur)});
$("#volume").insertAdjacentHTML("afterbegin",ICON.volume);
const levels=[...document.querySelectorAll(".Level")];
function showVol(v){$("#vbar").style.setProperty("--p",v);levels.forEach((l,i)=>l.classList.toggle("Hidden",v<[.02,.4,.725][i]))}
slider($("#vbar"),r=>showVol(r),r=>{showVol(r);if(player)player.setVolume(r)});showVol(.8);
$("#prev").innerHTML=ICON.skip;$("#pp").innerHTML=ICON.play;

let last=performance.now();
function tick(now){
  const dt=Math.min(.1,(now-last)/1000);last=now;
  gl.uniform1f(U("Time"),now/3500);gl.drawArrays(gl.TRIANGLES,0,6);
  if(live&&cur){
    const p=pos();
    if(!S.drag){$("#bar").style.setProperty("--p",S.dur?clamp(p/S.dur,0,1):0);$("#tcur").textContent=fmt(Math.floor(Math.min(p,S.dur||p)/1000))}
    if(S.playing&&S.dur&&p>=S.dur-300&&!S.ended){S.ended=true;stopClip()}
    if(S.lines.length){
      let i=-1;S.lines.forEach((l,k)=>{if(l.t<=p)i=k});
      if(i!==S.idx){S.idx=i;glow.Set(0);paint()}
      if(i>=0){
        const a=S.lines[i],end=i+1<S.lines.length?S.lines[i+1].t:Math.max(S.dur,a.t+1000);
        const ts=clamp((p-a.t)/(end-a.t),0,1);glow.f=rng([[0,0],[.5,1],[.925,1],[1,0]],ts);
        const g=glow.Update(dt),el=$("#list").children[i].firstChild.firstChild.style;
        el.setProperty("--p",120*ts+"%");el.setProperty("--gb",4+8*g+"px");el.setProperty("--go",g*.5);
      }
    }
  }
  requestAnimationFrame(tick);
}
const btn=(id,f)=>{const e=$(id),up=()=>e.classList.remove("Pressed");e.onclick=f;e.onpointerdown=()=>e.classList.add("Pressed");e.onpointerup=up;e.onpointerleave=up;e.onkeydown=k=>{if(k.key==="Enter"||k.key===" "){k.stopPropagation();k.preventDefault();f()}}};
btn("#prev",()=>{if(cur)playClip(cur)});btn("#pp",togglePlay);
addEventListener("mousemove",e=>{const W=Math.min(.3*innerWidth,.5*innerHeight)*1.1;$("#media").classList.toggle("ControlsVisible",e.clientX<innerWidth/2-.125*W)});
document.addEventListener("mouseleave",()=>$("#media").classList.remove("ControlsVisible"));
if(matchMedia("(hover:none)").matches)$("#media").addEventListener("click",()=>$("#media").classList.toggle("ControlsVisible"));
const toggleFS=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch{}};
addEventListener("keydown",e=>{
  if(!live||e.repeat||/^(INPUT|TEXTAREA)$/.test(e.target.tagName))return;
  const k=e.key,N=list().songs.length;
  if(cur){
    if(k==="Escape")closeModal();
    else if(k===" ")togglePlay();
    else if(k==="ArrowLeft")seek(pos()-10000);
    else if(k==="ArrowRight")seek(pos()+10000);
    else return;
  }else{
    if(k==="Enter"||k===" "||k==="ArrowRight"){if(revealed<N)reveal(N-revealed-1)}
    else if(k==="ArrowDown")switchList(1);
    else if(k==="ArrowUp")switchList(-1);
    else if(k==="Escape")leave();
    else if(k==="f"||k==="F")toggleFS();
    else return;
  }
  e.preventDefault();
});
$("#modal").onclick=e=>{if(["modal","panel","vp","list","msg"].includes(e.target.id))closeModal()};
$("#close").onclick=closeModal;
$("#exit").onclick=leave;
$("#present").onclick=present;

/* ---------- Boot ---------- */
(async()=>{
  $("#ruri").textContent=RURI;$("#cid").value=cid;
  $("#ruri").onclick=()=>navigator.clipboard.writeText(RURI).then(()=>toast("Redirect URI copied"),()=>toast("Select and copy the address shown"));
  $("#cid").onkeydown=e=>{if(e.key==="Enter")login()};
  const q=new URLSearchParams(location.search),code=q.get("code"),err=q.get("error");
  if(code){
    try{await tokenReq({grant_type:"authorization_code",code,redirect_uri:RURI,code_verifier:sessionStorage.getItem("top10.v")||""})}
    catch(e){store.set("top10.t","");toast("Spotify sign-in failed: "+e.message)}
  }else if(err)toast(err==="access_denied"?"Sign-in cancelled. Connect Spotify to continue.":"Spotify returned an error: "+err);
  if(code||err)history.replaceState({},"",RURI);
  render();if(tok())startPlayer();requestAnimationFrame(tick);
})();
</script>
</body>
</html>
